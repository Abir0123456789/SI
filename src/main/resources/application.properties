spring.application.name=4emeabirmersani
spring.datasource.url=jdbc:mysql://localhost:3306/db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8089
server.servlet.context-path=/api

# Jackson 3 (Spring Boot 4) desserialise via le @AllArgsConstructor de Lombok :
# un champ absent du JSON arrive a null -> 400 sur un type primitif (ex. Contrat.valide
# quand on envoie seulement {"idContrat":1}). On laisse le primitif a sa valeur par defaut.
spring.jackson.deserialization.fail-on-null-for-primitives=false
